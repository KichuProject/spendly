<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Spendly v3.0.0</title>
  <meta name="description" content="Reset your Spendly account password securely.">
  <link rel="icon" type="image/png" href="../assets/Logo.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================================
       DESIGN SYSTEM & THEME TOKENS (OLED BLACK & CLEAN LUXURY LIGHT)
       ========================================================== */
    :root[data-theme="dark"] {
      --bg-main: #000000;
      --bg-surface: #0A0A0D;
      --bg-card: #121216;
      --bg-card-hover: #1A1A22;
      --bg-pill: #1E1E24;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-hover: rgba(14, 165, 233, 0.3);
      --text-primary: #FFFFFF;
      --text-secondary: #A1A1AA;
      --text-muted: #71717A;
      --primary-accent: #0EA5E9;
      --primary-gradient: linear-gradient(135deg, #059669 0%, #0EA5E9 50%, #6366F1 100%);
      --emerald-accent: #10B981;
      --amber-accent: #F59E0B;
      --rose-accent: #F43F5E;
      --sky-accent: #38BDF8;
      --shadow-subtle: 0 16px 40px -12px rgba(0, 0, 0, 0.8);
      --shadow-glow: 0 0 50px -10px rgba(14, 165, 233, 0.35);
      --nav-bg: rgba(0, 0, 0, 0.8);
    }

    :root[data-theme="light"] {
      --bg-main: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F1F5F9;
      --bg-pill: #F1F5F9;
      --border-color: rgba(0, 0, 0, 0.08);
      --border-color-hover: rgba(14, 165, 233, 0.3);
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --primary-accent: #0284C7;
      --primary-gradient: linear-gradient(135deg, #047857 0%, #0284C7 50%, #4F46E5 100%);
      --emerald-accent: #059669;
      --amber-accent: #D97706;
      --rose-accent: #E11D48;
      --sky-accent: #0284C7;
      --shadow-subtle: 0 20px 40px -15px rgba(15, 23, 42, 0.06), 0 0 2px rgba(15, 23, 42, 0.04);
      --shadow-glow: 0 0 40px -8px rgba(2, 132, 199, 0.25);
      --nav-bg: rgba(255, 255, 255, 0.85);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Dynamic 3D Canvas Background */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.85;
    }

    /* NAVBAR */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-wrapper {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-logo img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .theme-toggle-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background: var(--bg-card-hover);
    }

    /* MAIN RESET FORM CARD */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 60px 24px;
      position: relative;
      z-index: 1;
    }

    .reset-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 32px;
      padding: 44px 36px;
      box-shadow: var(--shadow-subtle);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .reset-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 5px;
      background: var(--primary-gradient);
    }

    .card-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .icon-badge {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: var(--primary-gradient);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto 16px auto;
      box-shadow: var(--shadow-glow);
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.input-icon {
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      font-size: 15px;
    }

    .input-field {
      width: 100%;
      padding: 14px 44px 14px 44px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
    }

    /* Password Strength Indicator */
    .strength-wrapper {
      margin-top: 8px;
    }

    .strength-bar-bg {
      width: 100%;
      height: 6px;
      background: var(--bg-pill);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .strength-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .strength-text {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 22px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #FFFFFF;
      box-shadow: var(--shadow-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 60px -5px rgba(14, 165, 233, 0.5);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-color);
      margin-top: 12px;
    }

    .btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    /* Toast Notification */
    #toastContainer {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 24px 0;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg-surface);
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Dynamic 3D Constellation Mesh Background Engine -->
  <canvas id="bgCanvas"></canvas>

  <!-- Header Navbar -->
  <header>
    <div class="nav-wrapper">
      <a href="/index.html" class="brand-logo">
        <img src="../assets/Logo.png" alt="Spendly Logo">
        <span class="brand-name">Spendly</span>
      </a>

      <div style="display: flex; align-items: center; gap: 14px;">
        <button class="theme-toggle-btn" id="themeToggle" title="Toggle Light/Dark Theme">
          <i class="fa-solid fa-moon"></i>
        </button>

        <a href="/index.html" class="btn btn-secondary" style="width: auto; padding: 8px 16px; margin: 0; font-size: 13px;">
          <i class="fa-solid fa-house"></i> Home Page
        </a>
      </div>
    </div>
  </header>

  <!-- Main Reset Card -->
  <main>
    <div class="reset-card">
      <div class="card-header">
        <div class="icon-badge">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1>Reset Your Password</h1>
        <p class="subtitle">Enter your new password below to secure your Spendly account.</p>
      </div>

      <form id="resetForm" onsubmit="handleResetPassword(event)">
        <!-- New Password Field -->
        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="newPassword" class="input-field" placeholder="Enter at least 8 characters" required oninput="checkPasswordStrength()">
            <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility('newPassword', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          
          <div class="strength-wrapper">
            <div class="strength-bar-bg">
              <div class="strength-bar-fill" id="strengthBar"></div>
            </div>
            <div class="strength-text" id="strengthText">Password Strength: Enter password</div>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-shield-halved input-icon"></i>
            <input type="password" id="confirmPassword" class="input-field" placeholder="Re-enter your new password" required>
            <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility('confirmPassword', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <i class="fa-solid fa-circle-check"></i>
          <span>Reset & Update Password</span>
        </button>

        <a href="/index.html" class="btn btn-secondary">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to Spendly Home</span>
        </a>
      </form>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer"></div>

  <footer>
    &copy; 2026 Spendly Inc. All rights reserved. Version 3.0.0
  </footer>

  <script>
    // Toast Notification System
    function showToast(msg, icon = 'fa-circle-check') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      
      const toast = document.createElement('div');
      toast.style.cssText = 'background: var(--bg-surface); border: 1px solid var(--border-color); box-shadow: var(--shadow-subtle); color: var(--text-primary); padding: 12px 20px; border-radius: 14px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 10px; pointer-events: auto; animation: slideIn 0.3s ease;';
      toast.innerHTML = `<i class="fa-solid ${icon}" style="color: var(--primary-accent);"></i><span>${msg}</span>`;
      
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Theme Engine
    const themeToggle = document.getElementById('themeToggle');
    const htmlElement = document.documentElement;

    const savedTheme = localStorage.getItem('spendly-theme') || 'dark';
    htmlElement.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = htmlElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      htmlElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('spendly-theme', newTheme);
      updateThemeIcon(newTheme);
    });

    function updateThemeIcon(theme) {
      const icon = themeToggle.querySelector('i');
      icon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    }

    // Show / Hide Password Toggle
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    // Live Password Strength Indicator
    function checkPasswordStrength() {
      const val = document.getElementById('newPassword').value;
      const bar = document.getElementById('strengthBar');
      const text = document.getElementById('strengthText');

      if (!val) {
        bar.style.width = '0%';
        text.innerText = 'Password Strength: Enter password';
        return;
      }

      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      if (score <= 1) {
        bar.style.width = '25%';
        bar.style.background = 'var(--rose-accent)';
        text.innerText = 'Password Strength: Weak 🔴';
      } else if (score <= 3) {
        bar.style.width = '65%';
        bar.style.background = 'var(--amber-accent)';
        text.innerText = 'Password Strength: Medium 🟡';
      } else {
        bar.style.width = '100%';
        bar.style.background = 'var(--emerald-accent)';
        text.innerText = 'Password Strength: Strong & Secure 🔥';
      }
    }

    // Handle Reset Password Submit
    async function handleResetPassword(e) {
      e.preventDefault();
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      if (newPass !== confirmPass) {
        showToast('Passwords do not match!', 'fa-circle-xmark');
        return;
      }

      if (newPass.length < 6) {
        showToast('Password must be at least 6 characters!', 'fa-circle-exclamation');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Resetting Password...`;

      setTimeout(() => {
        showToast('Password reset successfully! Redirecting...', 'fa-circle-check');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 1200);
      }, 1000);
    }

    /* 17-Color 3D Sparkle Background Engine */
    (function initEnhanced3DBg() {
      const canvas = document.getElementById('bgCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const SPARKLE_COLORS = [
        '#10B981', '#06B6D4', '#3B82F6', '#6366F1', 
        '#8B5CF6', '#EC4899', '#F43F5E', '#F59E0B', 
        '#14B8A6', '#0284C7', '#A855F7', '#D946EF', 
        '#E11D48', '#EAB308', '#22C55E', '#38BDF8', '#84CC16'
      ];

      const particleCount = 110;
      const particles = [];
      const focalLength = 400;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: (Math.random() - 0.5) * width * 1.5,
          y: (Math.random() - 0.5) * height * 1.5,
          z: Math.random() * 800 - 400,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          vz: (Math.random() - 0.5) * 0.6,
          radius: Math.random() * 3 + 1.5,
          color: SPARKLE_COLORS[i % SPARKLE_COLORS.length],
        });
      }

      const cursorSparkles = [];
      let rotX = 0, rotY = 0;
      let targetRotX = 0, targetRotY = 0;

      window.addEventListener('mousemove', (e) => {
        targetRotY = (e.clientX / width - 0.5) * 0.4;
        targetRotX = (e.clientY / height - 0.5) * 0.4;

        if (cursorSparkles.length < 400) {
          for (let k = 0; k < 4; k++) {
            const color = SPARKLE_COLORS[Math.floor(Math.random() * SPARKLE_COLORS.length)];
            cursorSparkles.push({
              x: e.clientX + (Math.random() - 0.5) * 12,
              y: e.clientY + (Math.random() - 0.5) * 12,
              vx: (Math.random() - 0.5) * 1.8,
              vy: (Math.random() - 0.5) * 1.8 - 0.3,
              gravity: 0.04,
              size: Math.random() * 9 + 4,
              maxAlpha: Math.random() * 0.5 + 0.5,
              alpha: 1,
              decay: Math.random() * 0.004 + 0.002,
              color: color,
              rotation: Math.random() * Math.PI,
              rotSpeed: (Math.random() - 0.5) * 0.04,
              phase: Math.random() * Math.PI * 2
            });
          }
        }
      });

      window.addEventListener('click', (e) => {
        for (let k = 0; k < 32; k++) {
          const color = SPARKLE_COLORS[Math.floor(Math.random() * SPARKLE_COLORS.length)];
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 4 + 1.5;

          cursorSparkles.push({
            x: e.clientX,
            y: e.clientY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.2,
            gravity: Math.random() * 0.02 + 0.015,
            maxSpeedY: Math.random() * 1.5 + 0.8,
            size: Math.random() * 10 + 5,
            maxAlpha: 1,
            alpha: 1,
            decay: Math.random() * 0.0025 + 0.0015,
            color: color,
            rotation: Math.random() * Math.PI,
            rotSpeed: (Math.random() - 0.5) * 0.05,
            phase: Math.random() * Math.PI * 2
          });
        }
      });

      function drawMagicalSparkle(x, y, radius, color, alpha, rotation = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

        ctx.shadowColor = color;
        ctx.shadowBlur = 16;
        ctx.fillStyle = color;

        ctx.beginPath();
        ctx.moveTo(0, -radius);
        ctx.quadraticCurveTo(0, 0, radius, 0);
        ctx.quadraticCurveTo(0, 0, 0, radius);
        ctx.quadraticCurveTo(0, 0, -radius, 0);
        ctx.quadraticCurveTo(0, 0, 0, -radius);
        ctx.closePath();
        ctx.fill();

        const diagR = radius * 0.45;
        ctx.beginPath();
        ctx.moveTo(-diagR, -diagR);
        ctx.lineTo(diagR, diagR);
        ctx.moveTo(diagR, -diagR);
        ctx.lineTo(-diagR, diagR);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, Math.max(1, radius * 0.25), 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ctx.restore();
      }

      function render3DBg() {
        ctx.clearRect(0, 0, width, height);

        rotX += (targetRotX - rotX) * 0.05;
        rotY += (targetRotY - rotY) * 0.05;

        for (let i = cursorSparkles.length - 1; i >= 0; i--) {
          const s = cursorSparkles[i];
          s.x += s.vx; s.y += s.vy;
          if (s.gravity) {
            s.vy += s.gravity;
            s.vx *= 0.96;
            if (s.maxSpeedY && s.vy > s.maxSpeedY) s.vy = s.maxSpeedY;
          } else {
            s.vx *= 0.98; s.vy *= 0.98;
          }
          s.alpha -= s.decay;
          s.rotation += s.rotSpeed;

          if (s.alpha <= 0) {
            cursorSparkles.splice(i, 1);
          } else {
            drawMagicalSparkle(s.x, s.y, s.size, s.color, s.alpha, s.rotation);
          }
        }

        const projected = [];
        particles.forEach((p, idx) => {
          p.x += p.vx; p.y += p.vy; p.z += p.vz;
          if (p.x < -width) p.x = width; if (p.x > width) p.x = -width;
          if (p.y < -height) p.y = height; if (p.y > height) p.y = -height;
          if (p.z < -400) p.z = 400; if (p.z > 400) p.z = -400;

          let rx = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
          let rz = p.x * Math.sin(rotY) + p.z * Math.cos(rotY);
          let ry = p.y * Math.cos(rotX) - rz * Math.sin(rotX);
          rz = p.y * Math.sin(rotX) + rz * Math.cos(rotX);

          const scale = focalLength / (focalLength + rz + 500);
          const x2d = width / 2 + rx * scale;
          const y2d = height / 2 + ry * scale;
          projected.push({ x2d, y2d, scale, idx });
        });

        for (let i = 0; i < projected.length; i++) {
          for (let j = i + 1; j < projected.length; j++) {
            const p1 = projected[i]; const p2 = projected[j];
            const dx = p1.x2d - p2.x2d; const dy = p1.y2d - p2.y2d;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(p1.x2d, p1.y2d);
              ctx.lineTo(p2.x2d, p2.y2d);
              ctx.strokeStyle = particles[p1.idx].color;
              ctx.globalAlpha = (1 - dist / 120) * 0.2 * p1.scale;
              ctx.lineWidth = 1 * p1.scale;
              ctx.stroke();
            }
          }
        }

        projected.forEach((p) => {
          const particle = particles[p.idx];
          const r = Math.max(1.5, particle.radius * p.scale);
          drawMagicalSparkle(p.x2d, p.y2d, r * 2.2, particle.color, 0.5 * p.scale, Date.now() * 0.001 + p.idx);
        });

        requestAnimationFrame(render3DBg);
      }

      render3DBg();
    })();
  </script>
</body>
</html>
